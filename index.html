<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>내 가계부</title>
<meta name="theme-color" content="#f3f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1110" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Layout: 한 손 조작용 단일 컬럼 · 하단 탭바 · 바텀시트로 입력 */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#eaeeec; --ink:#121615; --ink-2:#47514e; --muted:#77817e;
  --line:#dfe5e3; --accent:#16624f; --accent-ink:#ffffff; --accent-soft:#dcece5;
  --good:#1d7a3a; --warn:#a86500; --crit:#c23b3b;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --g1:#8d9894; --g2:#b3bbb8; --g3:#646e6b; --none:#c9cfcd;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --r:16px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1110; --surface:#171b1a; --surface-2:#222827; --ink:#edf1ef; --ink-2:#bac3c0; --muted:#89938f;
  --line:#2a302e; --accent:#4cc19d; --accent-ink:#04241b; --accent-soft:#163029;
  --good:#3dbb5f; --warn:#e3a33a; --crit:#ec6b6b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --g1:#6e7975; --g2:#525b58; --g3:#97a29e; --none:#3a413f; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0e1110; --surface:#171b1a; --surface-2:#222827; --ink:#edf1ef; --ink-2:#bac3c0; --muted:#89938f;
  --line:#2a302e; --accent:#4cc19d; --accent-ink:#04241b; --accent-soft:#163029;
  --good:#3dbb5f; --warn:#e3a33a; --crit:#ec6b6b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --g1:#6e7975; --g2:#525b58; --g3:#97a29e; --none:#3a413f; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px 8px}
.top h1{font-size:19px;font-weight:750;margin:0;letter-spacing:-.01em}
.mnav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.mnav button{width:34px;height:32px;border-radius:999px;font-size:18px;color:var(--ink-2)}
.mnav button:active{background:var(--surface-2)}
.mnav span{font-weight:650;font-size:14px;min-width:92px;text-align:center}
.mnav small{display:block;font-size:10.5px;color:var(--muted);font-weight:500;line-height:1}

main{display:flex;flex-direction:column;gap:12px;padding-block:4px 20px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;border:1px solid var(--line);min-width:0}
.card h2{font-size:15px;margin:0 0 12px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 .aside{font-size:12.5px;color:var(--muted);font-weight:500}
.lbl{font-size:12.5px;color:var(--muted);font-weight:550;letter-spacing:.01em}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr{height:1px;background:var(--line);margin:12px 0}

/* hero */
.hero .amt{font-size:34px;font-weight:800;letter-spacing:-.025em;line-height:1.1;margin-top:4px}
.hero .amt small{font-size:20px;font-weight:700;margin-left:1px}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;margin-top:6px;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.delta.up{color:var(--crit)} .delta.down{color:var(--good)}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.mini{background:var(--surface-2);border-radius:12px;padding:10px 12px;text-align:left;min-width:0}
.mini b{display:block;font-size:16px;font-weight:700;margin-top:2px}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--accent)}
.bar.over>i{background:var(--crit)}
.bar .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-2);border-radius:2px}

/* banners */
.banner{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--ink);font-size:13.5px}
.banner .grow{line-height:1.35}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 14px;border-radius:12px;font-weight:650;font-size:14.5px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{color:var(--crit)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45}
.link{color:var(--accent);font-weight:650;font-size:13.5px}
.pending{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--warn);width:100%;text-align:left}
.pending .dot{width:10px;height:10px;border-radius:50%;background:var(--warn);flex:none}

/* donut + legend */
.donut-wrap{position:relative;width:min(220px,64vw);margin:4px auto 10px}
.donut{display:block;width:100%;height:auto}
.donut .seg{transition:opacity .15s}
.donut .seg.dim{opacity:.28}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:0 22%}
.donut-c b{font-size:19px;font-weight:800;letter-spacing:-.02em}
.donut-c span{font-size:12px;color:var(--muted);max-width:100%}
.cats{display:flex;flex-direction:column}
.catrow{display:grid;grid-template-columns:12px 1fr auto;gap:4px 10px;align-items:center;padding:10px 2px;border-top:1px solid var(--line);width:100%;text-align:left}
.catrow:first-child{border-top:0}
.sw{width:12px;height:12px;border-radius:4px;background:var(--c)}
.catrow .nm{font-weight:650;display:flex;gap:6px;align-items:baseline;min-width:0}
.catrow .nm small{color:var(--muted);font-weight:550;font-size:12.5px}
.catrow .v{font-weight:700;text-align:right}
.catrow .bar{grid-column:2/4;height:6px}
.catrow .bar>i{background:var(--c)}
.catrow .budget{grid-column:2/4;font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.catrow .budget.over{color:var(--crit);font-weight:600}
.subs{grid-column:2/4;display:flex;flex-direction:column;gap:7px;padding:6px 0 2px}
.subrow{display:grid;grid-template-columns:minmax(64px,auto) 1fr auto;gap:10px;align-items:center;font-size:13px}
.subrow .bar{height:6px}
.subrow .bar>i{background:var(--c);opacity:.75}
.chev{color:var(--muted);font-size:12px;transition:transform .15s;display:inline-block}
.open .chev{transform:rotate(90deg)}

/* lists */
.list{display:flex;flex-direction:column}
.txday{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600;padding:14px 2px 6px}
.tx{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:10px 2px;width:100%;text-align:left;border-radius:10px}
.tx:active{background:var(--surface-2)}
.ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:13px;font-weight:750;color:#fff;background:var(--c)}
.tx .t1{font-weight:650;font-size:15px}
.tx .t2{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tx .v{font-weight:700;text-align:right;font-size:15px}
.tx .v.neg{color:var(--good)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:650;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)}
.pill.good{background:color-mix(in srgb,var(--good) 14%,var(--surface));color:var(--good)}
.pill.crit{background:color-mix(in srgb,var(--crit) 14%,var(--surface));color:var(--crit)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

.seg-ctl{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px}
.seg-ctl button{height:32px;padding:0 14px;border-radius:9px;font-size:13.5px;font-weight:650;color:var(--muted)}
.seg-ctl button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px}
.hscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.hscroll::-webkit-scrollbar{display:none}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip .sw{width:9px;height:9px;border-radius:50%}
.chip.on{border-color:var(--c,var(--ink));background:color-mix(in srgb,var(--c,var(--ink)) 16%,var(--surface));color:var(--ink)}
.chip.sub{height:42px;padding:0 15px;font-size:15px}
.chip.sub.on{background:var(--c);color:#fff;border-color:var(--c)}
.chip.sm{height:30px;font-size:13px;padding:0 10px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11.5px;text-align:center;color:var(--muted);font-weight:600;padding-bottom:2px}
.cal .d{aspect-ratio:1/1.05;max-width:100%;border-radius:10px;padding:5px 4px;display:flex;flex-direction:column;justify-content:space-between;background:var(--surface-2);text-align:left;min-width:0;font-size:12px}
.cal .d b{font-weight:650;font-size:12px}
.cal .d span{font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:clip}
.cal .d.l1{background:color-mix(in srgb,var(--s1) 14%,var(--surface))}
.cal .d.l2{background:color-mix(in srgb,var(--s1) 30%,var(--surface))}
.cal .d.l3{background:color-mix(in srgb,var(--s1) 48%,var(--surface))}
.cal .d.l4{background:color-mix(in srgb,var(--s1) 68%,var(--surface))}
.cal .d.zero span{color:var(--good)}
.cal .d.fut{opacity:.4}
.cal .d.sel{outline:2px solid var(--ink);outline-offset:-2px}
.cal .d.blank{background:transparent}
.calkey{display:flex;gap:4px;align-items:center;font-size:11.5px;color:var(--muted);margin-top:10px}
.calkey i{width:14px;height:10px;border-radius:3px;display:inline-block}

/* charts */
.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.chart text{font-family:var(--font);font-size:10.5px;fill:var(--muted)}
.chart .lbl-strong{fill:var(--ink);font-weight:650;font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--g2);stroke-width:1}
.readout{font-size:13px;color:var(--ink-2);min-height:20px;margin-bottom:8px}
.readout b{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block}
.legend i.line{height:2px;border-radius:1px}
.legend i.dash{height:0;border-top:2px dashed var(--c);background:none}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-weight:600;color:var(--muted);text-align:right;padding:6px 4px;font-size:12px}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:8px 4px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:13.5px;padding:7px 0}
.hbar .bar{grid-column:1/3;height:6px}
.hbar .bar>i{background:var(--c,var(--s1))}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--surface)}
.split>i{display:block;height:100%}

/* fixed */
.fx{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:11px 2px;border-top:1px solid var(--line);width:100%;text-align:left}
.fx:first-of-type{border-top:0}
.dday{width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.dday b{font-size:14px;font-weight:750}
.dday small{font-size:10.5px;color:var(--muted);font-weight:600}
.dday.soon{background:color-mix(in srgb,var(--warn) 18%,var(--surface))}
.dday.soon b{color:var(--warn)}
.dday.paid{background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.dday.paid b{color:var(--good)}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat3>div{background:var(--surface-2);border-radius:12px;padding:10px;min-width:0}
.stat3 b{display:block;font-size:15.5px;font-weight:750;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* empty */
.empty{text-align:center;padding:28px 12px;color:var(--ink-2)}
.empty h3{margin:0 0 6px;font-size:17px;color:var(--ink)}
.empty p{margin:0 auto 16px;max-width:30ch;font-size:14px}

/* tabs + fab */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 92%,transparent);
  -webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:11px;font-weight:600;color:var(--muted)}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--ink)}
.fab{position:fixed;z-index:24;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));
  width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-size:30px;font-weight:400;
  box-shadow:0 6px 18px rgba(0,0,0,.18);display:grid;place-items:center;line-height:1}
.fab:active{transform:scale(.96)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.38);animation:fade .18s ease}
.sheet{position:relative;width:100%;max-width:560px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);overflow:auto;-webkit-overflow-scrolling:touch;
  background:var(--surface);border-radius:22px 22px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  animation:up .22s cubic-bezier(.2,.9,.3,1)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet,.backdrop{animation:none}}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.sh-head .k{font-size:13px;font-weight:650;color:var(--accent)}
.sh-head .x{width:34px;height:34px;border-radius:50%;background:var(--surface-2);font-size:16px;color:var(--ink-2)}
.amt-in{display:flex;align-items:baseline;gap:4px;border-bottom:2px solid var(--line);padding-bottom:4px;margin-bottom:12px}
.amt-in:focus-within{border-color:var(--accent)}
.amt-in input{border:0;background:transparent;font-size:32px;font-weight:800;letter-spacing:-.02em;width:100%;min-width:0;padding:0;outline:none;font-variant-numeric:tabular-nums}
.amt-in span{font-size:20px;font-weight:700;color:var(--ink-2)}
.fld{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px;min-width:0}
textarea.fld{height:auto;padding:10px 12px;min-height:92px;resize:vertical}
select.fld{appearance:none;-webkit-appearance:none}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fgrid .full{grid-column:1/3}
.meta{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.sec-t{font-size:12.5px;color:var(--muted);font-weight:650;margin:14px 0 8px;display:flex;justify-content:space-between}
.sheet-actions{display:flex;gap:8px;margin-top:16px}
.sheet-actions .btn{flex:1;height:48px;font-size:15.5px}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.toggle input{width:44px;height:26px;appearance:none;-webkit-appearance:none;background:var(--surface-2);border-radius:999px;position:relative;flex:none;border:1px solid var(--line);transition:background .15s}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.toggle input:checked{background:var(--accent);border-color:var(--accent)}
.toggle input:checked::after{transform:translateX(18px)}

/* settings */
.set{display:flex;flex-direction:column}
.set .it{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.set .it:first-child{border-top:0}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--surface-2);border-radius:10px;padding:10px 12px;word-break:break-all;user-select:all;-webkit-user-select:all}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--ink-2)}
ol.steps b{color:var(--ink)}
details.g{border-top:1px solid var(--line);padding:12px 0}
details.g summary{font-weight:650;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.g summary::-webkit-details-marker{display:none}
details.g summary::after{content:"＋";color:var(--muted)}

/* ───────────── 분석 ───────────── */
function vStats() {
  const keys = []; for (let i = 5; i >= 0; i--) keys.push(shiftKey(cur, -i));
  const per = keys.map(k => ({ k, items: catBreakdown(k), total: sum(txIn(k)), inc: incomeOf(k) }));
  const sc = niceScale(Math.max(...per.map(p => Math.max(p.total, p.inc)), 1)); const max = sc.max;
  const W = 340, H = 200, L = 4, R = 40, T = 10, B = 24; const bw = (W - L - R) / keys.length;
  const y = v => T + (H - T - B) * (1 - v / max);
  let g = '';
  for (let k = 0; k <= sc.steps; k++) { const v = sc.step * k; g += `<line class="${k ? 'grid' : 'base'}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>`; if (k) g += `<text x="${W - R + 4}" y="${y(v) + 3.5}">${man(v)}</text>`; }
  const used = new Set();
  per.forEach((p, i) => {
    const x0 = L + i * bw + bw * 0.22, w = bw * 0.56; let acc = 0;
    const sel = ui.trendSel === i;
    p.items.forEach(it => { used.add(it.id); const h0 = y(acc), h1 = y(acc + it.amt); acc += it.amt; g += `<rect x="${x0}" y="${h1}" width="${w}" height="${Math.max(0, h0 - h1)}" fill="${it.color}" stroke="var(--surface)" stroke-width="1.5" opacity="${ui.trendSel != null && !sel ? .35 : 1}"/>`; });
    if (p.inc) g += `<line x1="${x0 - 5}" x2="${x0 + w + 5}" y1="${y(p.inc)}" y2="${y(p.inc)}" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/>`;
    g += `<text x="${x0 + w / 2}" y="${H - 7}" text-anchor="middle" class="${p.k === cur ? 'lbl-strong' : ''}">${+p.k.slice(5)}월</text>`;
    g += `<rect data-bi="${i}" x="${L + i * bw}" y="0" width="${bw}" height="${H}" fill="transparent"/>`;
  });
  const sp = ui.trendSel != null ? per[ui.trendSel] : per[per.length - 1];
  const rate = sp.inc ? Math.round((sp.inc - sp.total) / sp.inc * 100) : null; const live = sp.k === nowKey();
  const legendCats = S.cats.filter(c => used.has(c.id));
  let h = `<section class="card"><h2>월별 지출과 소득 <span class="aside">막대를 누르면 상세</span></h2>
    <div class="readout" id="trRO"><b>${keyLabel(sp.k)}</b> · 지출 <b>${won(sp.total)}</b>${sp.inc ? ` · 소득 ${won(sp.inc)} ${live ? ' · 진행 중' : ` · 저축률 <b style="color:${rate < 0 ? 'var(--crit)' : 'var(--good)'}">${rate}%</b>`}` : ''}</div>
    <svg viewBox="0 0 ${W} ${H}" class="chart" id="trend" role="img" aria-label="최근 6개월 카테고리별 지출 누적 막대와 소득">${g}</svg>
    <div class="legend">${legendCats.map(c => `<span style="--c:${catColor(c.id)}"><i></i>${esc(c.name)}</span>`).join('')}${used.has('_none') ? `<span style="--c:var(--none)"><i></i>미분류</span>` : ''}<span style="--c:var(--ink)"><i class="line"></i>소득</span></div>
    <details class="g" style="margin-top:8px;padding-bottom:0"><summary>표로 보기</summary><div style="overflow-x:auto"><table class="t"><tr><th>월</th><th>소득</th><th>지출</th><th>저축률</th></tr>${per.map(p => `<tr><td>${keyLabel(p.k)}</td><td>${p.inc ? comma(p.inc) : '–'}</td><td>${comma(p.total)}</td><td>${p.k === nowKey() ? '진행 중' : p.inc ? Math.round((p.inc - p.total) / p.inc * 100) + '%' : '–'}</td></tr>`).join('')}</table></div></details></section>`;
  // 누적 페이스
  const P = paceChart(cur); window.__pace = P;
  h += `<section class="card"><h2>이번 달 쓰는 속도 <span class="aside">누적 지출</span></h2><div class="readout" id="paceRO"></div>${P.svg}
    <div class="legend"><span style="--c:var(--s1)"><i class="line"></i>${keyLabel(cur)}</span><span style="--c:var(--g1)"><i class="dash"></i>${keyLabel(shiftKey(cur, -1))}</span></div></section>`;
  // 고정 vs 변동
  const txs = txIn(cur); const tot = sum(txs);
  if (tot > 0) {
    const fixedAmt = sum(txs.filter(t => t.fixedId)); const ids = new Set(S.fixed.filter(f => f.kind === 'sub').map(f => f.id));
    const subAmt = sum(txs.filter(t => ids.has(t.fixedId))); const fx = fixedAmt - subAmt; const varA = tot - fixedAmt;
    h += `<section class="card"><h2>고정 vs 변동 <span class="aside">${keyLabel(cur)}</span></h2>
      <div class="split"><i style="width:${fx / tot * 100}%;background:var(--s3)"></i><i style="width:${subAmt / tot * 100}%;background:var(--s8)"></i><i style="flex:1;background:var(--s1)"></i></div>
      <div class="stat3" style="margin-top:12px"><div><span class="lbl">고정비</span><b class="num">${short(fx)}</b></div><div><span class="lbl">구독</span><b class="num">${short(subAmt)}</b></div><div><span class="lbl">변동지출</span><b class="num">${short(varA)}</b></div></div>
      <div class="hint">변동지출이 실제로 줄일 수 있는 돈이에요.</div></section>`;
    // 많이 쓴 곳
    const mm = {}; txs.forEach(t => { const k = t.merchant; (mm[k] = mm[k] || { amt: 0, n: 0, cat: t.cat }); mm[k].amt += t.amt; mm[k].n++; });
    const top = Object.entries(mm).sort((a, b) => b[1].amt - a[1].amt).slice(0, 8); const tmax = top[0] ? top[0][1].amt : 1;
    h += `<section class="card"><h2>많이 쓴 곳 <span class="aside">${keyLabel(cur)} Top ${top.length}</span></h2>${top.map(([m, o]) => `<div class="hbar" style="--c:${catColor(o.cat)}"><span class="ell">${esc(m)} <span class="muted">· ${o.n}회</span></span><b class="num">${won(o.amt)}</b><div class="bar"><i style="width:${o.amt / tmax * 100}%"></i></div></div>`).join('')}</section>`;
    // 결제수단
    const cm = {}; txs.forEach(t => { const k = t.card || '기타'; cm[k] = (cm[k] || 0) + t.amt; });
    const cs = Object.entries(cm).sort((a, b) => b[1] - a[1]);
    h += `<section class="card"><h2>결제수단별</h2>${cs.map(([k, v]) => `<div class="hbar" style="--c:var(--g3)"><span class="ell">${esc(k)}</span><b class="num">${won(v)} <span class="muted" style="font-weight:500">${Math.round(v / tot * 100)}%</span></b><div class="bar"><i style="width:${v / cs[0][1] * 100}%"></i></div></div>`).join('')}</section>`;

  }
  return h;
}

      <li>새 단축어 <b>가계부</b>: <b>파일 가져오기</b>(Shortcuts/가계부대기.txt, 찾지 못하면 오류 끄기) → <b>URL 인코딩</b> → <b>텍스트</b> <span class="code" style="display:inline;padding:2px 6px">${esc(u)}#q=</span> + 인코딩된 텍스트 → <b>URL 열기</b> → <b>텍스트</b>(빈칸 하나) → <b>파일 저장</b>(같은 경로, 덮어쓰기 켜기)</li>
      <li>이 단축어를 <b>홈 화면에 추가</b>해서 가계부 아이콘으로 쓰세요. 열 때마다 놓친 결제가 결제 시각 그대로 들어오고, 이미 기록된 건 걸러져요.</li>
      <li>여러 건이 밀려 있으면 <b>추천대로 모두 저장</b>을 누르세요. 추천이 없는 것만 하나씩 물어봐요.</li></ol></div></details>
    <details class="g"><summary>카드 결제 문자(SMS)로 자동 기록</summary><div><ol class="steps">
      <li><b>자동화 → ＋ → 메시지</b>, 메시지 내용에 <b>승인</b> → <b>즉시 실행</b> → 위 <b>가계부 기록</b> 단축어 실행.</li></ol></div></details>
    <details class="g"><summary>애플페이(지갑) 결제 자동 기록</summary><div><ol class="steps">
      <li><b>자동화 → ＋ → 지갑</b> → 카드 선택 → <b>즉시 실행</b></li>
      <li><b>텍스트</b>: <span class="code" style="display:inline;padding:2px 6px">애플페이|[금액]|[가맹점]|[카드 또는 패스]</span> (대괄호는 단축어 입력의 변수)</li>
      <li><b>URL 인코딩</b> → <b>텍스트</b>(주소#add= + 인코딩 결과) → <b>URL 열기</b></li></ol></div></details>
    <details class="g"><summary>홈 화면에 추가할 때 주의</summary><div><p class="ink2" style="margin:0;font-size:14px">사파리 공유 → <b>홈 화면에 추가</b>할 때 <b>‘웹 앱으로 열기’를 끄세요.</b> 웹 앱으로 열면 사파리와 저장 공간이 따로 생겨서, 단축어로 들어온 결제가 보이지 않아요. 위의 ‘가계부’ 단축어를 홈 화면에 두는 방법을 가장 추천해요.</p></div></details>
  </section>`;
  h += `<section class="card"><h2>결제 알림 테스트</h2><textarea class="fld" id="tmsg" placeholder="받은 결제 알림이나 문자를 붙여 넣어 보세요">토스뱅크 체크카드
배달의민족에서 12,500원 결제했어요</textarea><div id="tres" class="meta" style="margin:10px 0 0"></div><div class="row" style="gap:8px;margin-top:10px"><button class="btn sm" id="tparse">읽어 보기</button><button class="btn sm pri" id="tadd">이 내용으로 기록</button></div></section>`;
  h += `<section class="card"><h2>예산 · 기간</h2><div class="set">
    <div class="it"><span>한 달 예산</span><input class="fld num" id="sBud" inputmode="numeric" style="max-width:150px;text-align:right" value="${S.settings.budget ? comma(S.settings.budget) : ''}" placeholder="0"></div>
    <div class="it"><span>한 달 시작일<div class="hint" style="margin:0">월급날이나 카드 결제일 기준</div></span><select class="fld" id="sStart" style="max-width:110px">${Array.from({ length: 28 }, (_, i) => `<option value="${i + 1}" ${S.settings.monthStart === i + 1 ? 'selected' : ''}>매달 ${i + 1}일</option>`).join('')}</select></div></div></section>`;
  h += `<section class="card"><h2>카테고리 · 세부항목 <span class="aside">예산은 선택</span></h2><div id="catEd">${S.cats.map(c => `<div class="catedit" data-c="${c.id}">
      <div class="row"><span class="sw" style="--c:${catColor(c.id)};width:12px;height:12px;border-radius:4px;background:var(--c)"></span><input class="fld grow" data-cname value="${esc(c.name)}" style="height:38px;font-weight:650"><input class="fld num" data-cbud inputmode="numeric" placeholder="예산" value="${c.budget ? comma(c.budget) : ''}" style="height:38px;width:110px;text-align:right"></div>
      <div class="chips" style="margin-top:8px">${c.subs.map(s => `<span class="chip sm">${esc(s.name)} <button data-rmsub="${s.id}" aria-label="${esc(s.name)} 삭제" class="muted">×</button></span>`).join('')}<input class="fld" data-addsub placeholder="＋ 세부항목" style="height:30px;width:110px;font-size:13px;border-radius:999px"></div></div>`).join('')}</div>
    <div class="row" style="gap:8px;margin-top:10px"><input class="fld grow" id="newCat" placeholder="새 카테고리 이름"><button class="btn" id="addCat">추가</button></div></section>`;
  h += `<section class="card"><h2>자동 분류</h2><div class="set"><div class="it"><span>내가 고른 사용처 기억 <b class="num">${Object.keys(S.rules).length}</b>곳</span><button class="btn sm" id="clrRules">초기화</button></div></div><div class="hint">결제 문자의 사용처를 한 번 분류하면 다음부터 같은 곳은 자동으로 골라져요.</div></section>`;
  h += `<section class="card"><h2>데이터 <span class="aside">${lb == null ? '백업한 적 없음' : lb === 0 ? '오늘 백업함' : lb + '일 전 백업'}</span></h2>
    <div class="hint" style="margin:0 0 10px">기록은 이 아이폰의 사파리 안에만 저장돼요. 사파리 방문 기록을 지우거나 오래 열지 않으면 사라질 수 있으니 가끔 백업 파일을 iCloud Drive에 저장해 두세요.</div>
    <div class="chips"><button class="btn sm pri" id="bkFile">백업 파일 저장</button><button class="btn sm" id="bkCopy">백업 복사</button><label class="btn sm" for="rsFile">백업 불러오기</label><input type="file" id="rsFile" accept=".json,application/json" hidden><button class="btn sm" id="csv">CSV 내보내기</button></div>
    <div class="hr"></div><div class="chips">${S.sample ? '<button class="btn sm" data-act="clearSample">예시 데이터 지우기</button>' : '<button class="btn sm" data-act="sample">예시 데이터 넣기</button>'}<button class="btn sm danger" id="wipe">모두 지우기</button></div><div id="wipeC"></div></section>`;
  h += `<p class="hint" style="text-align:center">내 가계부 · 기록 ${S.tx.length}건</p>`;
  return h;
}
function download(name, text, type) {
  const blob = new Blob([text], { type }); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
async function copyText(t) { try { await navigator.clipboard.writeText(t); toast('복사했어요'); } catch (e) { toast('복사가 막혀 있어요. 길게 눌러 직접 복사하세요.'); } }
bind.set = v => {
  v.addEventListener('click', e => {
    const a = e.target.closest('[data-act]'); if (a) return act(a.dataset.act);
    const c = e.target.closest('[data-copy]'); if (c) return copyText($('#' + c.dataset.copy).textContent);
    const rm = e.target.closest('[data-rmsub]'); if (rm) {
      const cid = rm.closest('[data-c]').dataset.c; const cat = catById(cid); if (cat.subs.length <= 1) return toast('세부항목은 하나 이상 있어야 해요');
      cat.subs = cat.subs.filter(s => s.id !== rm.dataset.rmsub); S.tx.forEach(t => { if (t.sub === rm.dataset.rmsub) t.sub = null; }); save(); render();
    }
  });
  $('#tparse').onclick = () => { const p = parseMsg($('#tmsg').value); const sg = p && suggest(p.merchant); $('#tres').innerHTML = p && p.skip ? '<span class="pill warn">결제 내역이 아닌 알림으로 보여서 건너뛰어요</span>' : p ? `<span class="pill acc">금액 ${p.amt ? won(p.amt) : '못 찾음'}</span><span class="pill">사용처 ${esc(p.merchant)}</span><span class="pill">${esc(p.card || '카드 미확인')}</span><span class="pill">${p.date.replace('T', ' ')}</span>${p.cancel ? '<span class="pill good">취소</span>' : ''}${sg ? `<span class="pill">추천 ${esc(catName(sg.cat))} · ${esc(subName(sg.cat, sg.sub))}</span>` : '<span class="pill warn">추천 없음</span>'}` : '내용이 비어 있어요'; };
  $('#tadd').onclick = () => { ingest.skipped = 0; ingest.dups = 0; const t = ingest($('#tmsg').value); if (!t) { toast(ingest.skipped ? '결제 내역이 아닌 알림으로 보여요' : '이미 기록된 결제예요'); return; } save(); openEditor(t, { incoming: true, left: 0 }); };
  $('#sBud').onchange = e => { S.settings.budget = num(e.target.value); e.target.value = S.settings.budget ? comma(S.settings.budget) : ''; save(); toast('예산을 저장했어요'); };
  $('#sStart').onchange = e => { S.settings.monthStart = +e.target.value; cur = nowKey(); save(); toast(`한 달을 매달 ${e.target.value}일부터 계산해요`); };
  $$('[data-c]', v).forEach(row => {
    const cat = catById(row.dataset.c);
    $('[data-cname]', row).onchange = e => { cat.name = e.target.value.trim() || cat.name; save(); };
    $('[data-cbud]', row).onchange = e => { cat.budget = num(e.target.value); e.target.value = cat.budget ? comma(cat.budget) : ''; save(); };
    $('[data-addsub]', row).onkeydown = e => { if (e.key === 'Enter' && e.target.value.trim()) { cat.subs.push({ id: cat.id + '_' + uid(), name: e.target.value.trim() }); save(); render(); } };
    $('[data-addsub]', row).onblur = e => { if (e.target.value.trim()) { cat.subs.push({ id: cat.id + '_' + uid(), name: e.target.value.trim() }); save(); render(); } };
  });
  $('#addCat').onclick = () => { const n = $('#newCat').value.trim(); if (!n) return; const id = 'c' + uid(); S.cats.push({ id, name: n, budget: 0, subs: [{ id: id + '_0', name: n }] }); save(); render(); };
  $('#clrRules').onclick = () => { S.rules = {}; save(); render(); toast('기억한 분류를 초기화했어요'); };
  const dump = () => JSON.stringify({ ...S, exportedAt: new Date().toISOString() });
  $('#bkFile').onclick = () => { download(`가계부-백업-${fmtDT(new Date()).slice(0, 10)}.json`, dump(), 'application/json'); S.settings.lastBackup = Date.now(); save(); };
  $('#bkCopy').onclick = () => { copyText(dump()); S.settings.lastBackup = Date.now(); save(); };
  $('#rsFile').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (!d.v || !Array.isArray(d.tx)) throw 0; S = d; save(); cur = nowKey(); render(); toast(`불러왔어요 · 기록 ${S.tx.length}건`); } catch (err) { toast('가계부 백업 파일이 아니에요'); } }; r.readAsText(f); };
  $('#csv').onclick = () => {
    const rows = [['날짜', '시간', '금액', '사용처', '카테고리', '세부항목', '결제수단', '할부', '메모']].concat(S.tx.slice().sort((a, b) => a.date < b.date ? -1 : 1).map(t => [t.date.slice(0, 10), t.date.slice(11), t.amt, t.merchant, catName(t.cat), subName(t.cat, t.sub), t.card || '', t.inst || '', t.memo || '']));
    download(`가계부-${fmtDT(new Date()).slice(0, 10)}.csv`, '﻿' + rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(',')).join('\n'), 'text/csv');
  };
  $('#wipe').onclick = () => { $('#wipeC').innerHTML = `<div class="banner" style="margin-top:10px;background:color-mix(in srgb,var(--crit) 12%,var(--surface))"><div class="grow">기록 ${S.tx.length}건, 고정·구독, 소득, 카테고리가 모두 지워지고 되돌릴 수 없어요.</div><button class="btn sm" id="wipeNo">취소</button><button class="btn sm danger" id="wipeYes" style="background:var(--crit);color:#fff">지우기</button></div>`; $('#wipeNo').onclick = () => $('#wipeC').innerHTML = ''; $('#wipeYes').onclick = () => { S = blankState(); save(); render(); toast('모두 지웠어요'); }; };
};

/* ───────────── 바텀시트 ───────────── */
// 알림으로 열린 탭은 기록이 끝나면 스스로 닫아서 사파리 탭이 쌓이지 않게 함
// (사파리는 다른 앱이 열어 준, 방문 기록이 1개뿐인 탭만 스크립트로 닫을 수 있음)
let autoCloseTab = false, closeTimer = null;
function scheduleTabClose(ms = 900) {
  if (!autoCloseTab) return;
  clearTimeout(closeTimer);
  closeTimer = setTimeout(() => { if (!$('#sheetWrap').hidden) return; autoCloseTab = false; try { window.close(); } catch (e) { } }, ms);
}
function openSheet(html) { clearTimeout(closeTimer); $('#sheet').innerHTML = `<div class="grab"></div>` + html; $('#sheetWrap').hidden = false; $('#sheet').scrollTop = 0; document.body.style.overflow = 'hidden'; }
function closeSheet() { $('#sheetWrap').hidden = true; document.body.style.overflow = ''; if (autoCloseTab) scheduleTabClose(); }
$('#backdrop').onclick = () => { closeSheet(); render(); };

let draft = null, draftOpts = {};
function openEditor(t, opts = {}) {
  draftOpts = opts;
  draft = t ? { ...t } : { id: null, date: fmtDT(new Date()), amt: 0, merchant: '', cat: null, sub: null, card: '', memo: '', src: 'manual' };
  const isNew = !t; const inc = opts.incoming;
  const kicker = inc ? `결제 알림에서 가져왔어요${opts.left ? ` · ${opts.left}건 더` : ''}` : isNew ? '직접 입력' : '내역 수정';
  openSheet(`<div class="sh-head"><span class="k">${kicker}</span><button class="x" id="edX" aria-label="닫기">✕</button></div>
    ${inc && opts.left ? `<button class="btn sm" id="edAll" style="width:100%;margin:-4px 0 12px">추천대로 ${opts.left + 1}건 모두 저장</button>` : ''}
    <div class="amt-in"><input id="edAmt" inputmode="numeric" placeholder="0" value="${draft.amt ? comma(Math.abs(draft.amt)) : ''}" aria-label="금액"><span>원</span></div>
    <div class="fgrid"><input class="fld" id="edMer" placeholder="사용처" value="${esc(draft.merchant)}" aria-label="사용처"><input class="fld" id="edDate" type="datetime-local" value="${esc(draft.date)}" aria-label="날짜와 시간"></div>
    <div class="meta">${draft.card ? `<span class="pill">${esc(draft.card)}</span>` : ''}${draft.inst > 1 ? `<span class="pill">${draft.inst}개월 할부</span>` : ''}${draft.amt < 0 ? '<span class="pill good">승인취소</span>' : ''}${draft.memo && /해외/.test(draft.memo) ? `<span class="pill warn">${esc(draft.memo)}</span>` : ''}${draft.why && !draft.confirmed ? `<span class="pill acc">추천: ${esc(draft.why)}</span>` : ''}${draft.fixedId ? `<span class="pill acc">${esc((S.fixed.find(f => f.id === draft.fixedId) || {}).name || '')} 연결</span>` : ''}</div>
    <div id="edChips"></div>
    <div class="sec-t"><span>메모</span></div><input class="fld" id="edMemo" placeholder="선택" value="${esc(draft.memo && !/해외|승인취소/.test(draft.memo) ? draft.memo : '')}">
    <div class="sheet-actions">${!isNew ? `<button class="btn danger" id="edDel" style="flex:.6">삭제</button>` : ''}${inc ? `<button class="btn" id="edLater" style="flex:.7">나중에</button>` : ''}<button class="btn pri" id="edSave">저장</button></div>
    <div id="edDelC"></div>`);
  drawChips();
  const amt = $('#edAmt');
  amt.oninput = () => { const n = num(amt.value); amt.value = n ? comma(n) : ''; };
  if (isNew || draft.needAmt) setTimeout(() => amt.focus(), 60);
  $('#edX').onclick = () => { closeSheet(); render(); };
  $('#edSave').onclick = commit;
  if ($('#edLater')) $('#edLater').onclick = () => { closeSheet(); queue.length ? nextInQueue() : render(); };
  if ($('#edAll')) $('#edAll').onclick = saveAllSuggested;
  if ($('#edDel')) $('#edDel').onclick = () => {
    $('#edDelC').innerHTML = `<div class="banner" style="margin-top:10px;background:color-mix(in srgb,var(--crit) 12%,var(--surface))"><div class="grow">${esc(draft.merchant)} ${won(draft.amt)} 기록을 지울까요?</div><button class="btn sm danger" id="edDelY" style="background:var(--crit);color:#fff">지우기</button></div>`;
    $('#edDelY').onclick = () => { S.tx = S.tx.filter(x => x.id !== draft.id); save(); closeSheet(); render(); toast('지웠어요'); };
  };
}
function drawChips() {
  const c = catById(draft.cat);
  let h = `<div class="sec-t"><span>카테고리</span></div><div class="chips">${S.cats.map(k => `<button class="chip ${draft.cat === k.id ? 'on' : ''}" data-ec="${k.id}" style="--c:${catColor(k.id)}"><span class="sw" style="background:${catColor(k.id)}"></span>${esc(k.name)}</button>`).join('')}</div>`;
  if (c) h += `<div class="sec-t"><span>${esc(c.name)} 세부항목</span><span>누르면 바로 저장</span></div><div class="chips">${c.subs.map(s => `<button class="chip sub ${draft.sub === s.id ? 'on' : ''}" data-es="${s.id}" style="--c:${catColor(c.id)}">${esc(s.name)}</button>`).join('')}</div>`;
  else h += `<div class="hint">카테고리를 고르면 세부항목이 나와요.</div>`;
  const box = $('#edChips'); box.innerHTML = h;
  box.onclick = e => {
    const cc = e.target.closest('[data-ec]'); if (cc) { readDraft(); draft.cat = cc.dataset.ec; const cat = catById(draft.cat); draft.sub = cat.subs.length === 1 ? cat.subs[0].id : null; drawChips(); return; }
    const ss = e.target.closest('[data-es]'); if (ss) { readDraft(); draft.sub = ss.dataset.es; drawChips(); commit(); }
  };
}
function readDraft() {
  const a = num($('#edAmt').value); draft.amt = draft.amt < 0 ? -a : a;
  draft.merchant = $('#edMer').value.trim(); draft.date = $('#edDate').value || draft.date;
  const memo = $('#edMemo').value.trim(); draft.memo = memo || (draft.memo && /해외|승인취소/.test(draft.memo) ? draft.memo : '');
}
function commit() {
  readDraft();
  if (!draft.amt) { toast('금액을 입력해 주세요'); $('#edAmt').focus(); return; }
  if (!draft.cat) { toast('카테고리를 골라 주세요'); return; }
  draft.merchant = draft.merchant || catName(draft.cat);
  draft.confirmed = true; delete draft.needAmt;
  if (!draft.fixedId) { const sg = suggest(draft.merchant); if (sg && sg.fixedId) draft.fixedId = sg.fixedId; }
  if (draft.id) { const i = S.tx.findIndex(x => x.id === draft.id); if (i >= 0) S.tx[i] = draft; else S.tx.push(draft); }
  else { draft.id = uid(); S.tx.push(draft); }
  learn(draft); save();
  const label = `${catName(draft.cat)}${draft.sub ? ' · ' + subName(draft.cat, draft.sub) : ''}`;
  if (draftOpts.incoming && queue.length) { toast(`저장 · ${label}`); nextInQueue(); render(); return; }
  closeSheet(); render(); toast(`저장했어요 · ${label} ${won(draft.amt)}`);
}

// 밀린 결제 한꺼번에: 추천(카테고리)과 금액이 있는 건 저장, 없는 건만 하나씩 다시 묻기
function saveAllSuggested() {
  readDraft();
  const i0 = S.tx.findIndex(x => x.id === draft.id); if (i0 >= 0) S.tx[i0] = draft;
  const left = []; let done = 0;
  for (const id of [draft.id, ...queue]) {
    const t = S.tx.find(x => x.id === id); if (!t) continue;
    if (t.cat && t.amt) { t.confirmed = true; delete t.needAmt; t.merchant = t.merchant || catName(t.cat); learn(t); done++; }
    else left.push(id);
  }
  save(); queue = left;
  toast(`${done}건 저장했어요${left.length ? ` · ${left.length}건은 직접 골라 주세요` : ''}`);
  nextInQueue(); render();
}

/* 소득 */
function openIncome(key) {
  const list = S.income.filter(i => i.month === key);
  openSheet(`<div class="sh-head"><span class="k">${keyLabel(key)} 소득</span><button class="x" id="inX" aria-label="닫기">✕</button></div>
    <div class="hero"><div class="amt num">${comma(incomeOf(key))}<small>원</small></div></div>
    <div class="list" style="margin-top:10px">${list.map(i => `<div class="row" style="padding:10px 0;border-top:1px solid var(--line)"><span class="grow">${esc(i.name)}</span><b class="num">${won(i.amt)}</b><button class="btn sm ghost" data-rmi="${i.id}">삭제</button></div>`).join('') || '<div class="muted" style="font-size:14px">아직 입력한 소득이 없어요.</div>'}</div>
    <div class="sec-t"><span>추가</span></div>
    <div class="fgrid"><input class="fld" id="inName" placeholder="월급, 부수입 등" value="${list.length ? '' : '월급'}"><input class="fld num" id="inAmt" inputmode="numeric" placeholder="금액"></div>
    <div class="chips" style="margin-top:8px">${[...new Set(S.income.filter(i => i.month !== key).map(i => i.name + '|' + i.amt))].slice(0, 3).map(s => { const [n, a] = s.split('|'); return `<button class="chip sm" data-qi="${esc(s)}">${esc(n)} ${man(+a)}원 그대로</button>`; }).join('')}</div>
    <div class="sheet-actions"><button class="btn pri" id="inAdd">소득 추가</button></div>`);
  const ia = $('#inAmt'); ia.oninput = () => { const n = num(ia.value); ia.value = n ? comma(n) : ''; };
  $('#inX').onclick = () => { closeSheet(); render(); };
  $('#sheet').onclick = e => {
    const r = e.target.closest('[data-rmi]'); if (r) { S.income = S.income.filter(i => i.id !== r.dataset.rmi); save(); openIncome(key); }
    const q = e.target.closest('[data-qi]'); if (q) { const [n, a] = q.dataset.qi.split('|'); S.income.push({ id: uid(), month: key, name: n, amt: +a }); save(); openIncome(key); }
  };
  $('#inAdd').onclick = () => { const a = num(ia.value); if (!a) return toast('금액을 입력해 주세요'); S.income.push({ id: uid(), month: key, name: $('#inName').value.trim() || '소득', amt: a }); save(); openIncome(key); };
}

/* 고정·구독 편집 */
let fdraft = null;
function openFixed(f, kind = 'fixed', pre) {
  fdraft = f ? { ...f } : { id: null, name: pre ? pre.name : '', amt: pre ? pre.amt : 0, day: pre ? pre.day : new Date().getDate(), cycle: 'monthly', month: new Date().getMonth() + 1, kind, cat: pre ? pre.cat : (kind === 'sub' ? 'sub' : 'house'), sub: pre ? pre.sub : null, auto: false, keyword: pre ? pre.name : '', active: true, start: fmtDT(new Date()).slice(0, 10) };
  const c = catById(fdraft.cat);
  openSheet(`<div class="sh-head"><span class="k">${f ? '수정' : '새 항목'}</span><button class="x" id="fX" aria-label="닫기">✕</button></div>
    <div class="seg-ctl" style="margin-bottom:12px"><button data-kind="fixed" class="${fdraft.kind !== 'sub' ? 'on' : ''}">고정비</button><button data-kind="sub" class="${fdraft.kind === 'sub' ? 'on' : ''}">구독</button></div>
    <div class="amt-in"><input id="fAmt" inputmode="numeric" placeholder="0" value="${fdraft.amt ? comma(fdraft.amt) : ''}" aria-label="금액"><span>원</span></div>
    <div class="fgrid"><input class="fld full" id="fName" placeholder="이름 (예: 넷플릭스)" value="${esc(fdraft.name)}">
      <select class="fld" id="fCycle"><option value="monthly" ${fdraft.cycle === 'monthly' ? 'selected' : ''}>매월</option><option value="yearly" ${fdraft.cycle === 'yearly' ? 'selected' : ''}>매년</option></select>
      <select class="fld" id="fDay">${Array.from({ length: 31 }, (_, i) => `<option value="${i + 1}" ${+fdraft.day === i + 1 ? 'selected' : ''}>${i + 1}일</option>`).join('')}</select>
      <select class="fld full" id="fMonth" ${fdraft.cycle === 'yearly' ? '' : 'hidden'}>${Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}" ${+fdraft.month === i + 1 ? 'selected' : ''}>${i + 1}월에 결제</option>`).join('')}</select>
      <input class="fld full" id="fKey" placeholder="결제 문자 속 사용처 이름 (자동 연결용)" value="${esc(fdraft.keyword || '')}"></div>
    <div id="fChips"></div>
    <label class="toggle"><span>자동 기록<div class="hint" style="margin:0">결제 문자가 오지 않는 자동이체용. 결제일에 지출로 기록해요.</div></span><input type="checkbox" id="fAuto" ${fdraft.auto ? 'checked' : ''}></label>
    ${f ? `<label class="toggle"><span>사용 중</span><input type="checkbox" id="fAct" ${fdraft.active ? 'checked' : ''}></label>` : ''}
    <div class="sheet-actions">${f ? '<button class="btn danger" id="fDel" style="flex:.6">삭제</button>' : ''}<button class="btn pri" id="fSave">저장</button></div>`);
  const fa = $('#fAmt'); fa.oninput = () => { const n = num(fa.value); fa.value = n ? comma(n) : ''; };
  $('#fCycle').onchange = e => { $('#fMonth').hidden = e.target.value !== 'yearly'; };
  $('#fX').onclick = () => { closeSheet(); render(); };
  $$('[data-kind]').forEach(b => b.onclick = () => { fdraft.kind = b.dataset.kind; $$('[data-kind]').forEach(x => x.classList.toggle('on', x === b)); if (fdraft.kind === 'sub' && !f) { fdraft.cat = 'sub'; fdraft.sub = null; drawFChips(); } });
  drawFChips();
  if ($('#fDel')) $('#fDel').onclick = () => { S.fixed = S.fixed.filter(x => x.id !== f.id); S.tx.forEach(t => { if (t.fixedId === f.id) t.fixedId = null; }); save(); closeSheet(); render(); toast('삭제했어요'); };
  $('#fSave').onclick = () => {
    Object.assign(fdraft, { amt: num(fa.value), name: $('#fName').value.trim(), cycle: $('#fCycle').value, day: +$('#fDay').value, month: +$('#fMonth').value, keyword: $('#fKey').value.trim() || $('#fName').value.trim(), auto: $('#fAuto').checked });
    if ($('#fAct')) fdraft.active = $('#fAct').checked;
    if (!fdraft.name || !fdraft.amt) return toast('이름과 금액을 입력해 주세요');
    if (!fdraft.cat) return toast('카테고리를 골라 주세요');
    if (fdraft.id) { const i = S.fixed.findIndex(x => x.id === fdraft.id); S.fixed[i] = fdraft; }
    else {
      fdraft.id = uid(); S.fixed.push(fdraft);
      // 이미 기록된 같은 사용처 결제를 연결
      const fk = mkey(fdraft.keyword);
      S.tx.forEach(t => { if (!t.fixedId && fk && mkey(t.merchant).includes(fk)) t.fixedId = fdraft.id; });
    }
    if (pre) S.dismissed[pre.k] = 1;
    runFixed(); save(); closeSheet(); render(); toast('저장했어요');
  };
}
function drawFChips() {
  const c = catById(fdraft.cat);
  let h = `<div class="sec-t"><span>카테고리</span></div><div class="chips">${S.cats.map(k => `<button class="chip sm ${fdraft.cat === k.id ? 'on' : ''}" data-fc2="${k.id}" style="--c:${catColor(k.id)}"><span class="sw" style="background:${catColor(k.id)}"></span>${esc(k.name)}</button>`).join('')}</div>`;
  if (c) h += `<div class="chips" style="margin-top:8px">${c.subs.map(s => `<button class="chip sm ${fdraft.sub === s.id ? 'on' : ''}" data-fs2="${s.id}" style="--c:${catColor(c.id)}">${esc(s.name)}</button>`).join('')}</div>`;
  const box = $('#fChips'); box.innerHTML = h;
  box.onclick = e => {
    const a = e.target.closest('[data-fc2]'); if (a) { fdraft.cat = a.dataset.fc2; fdraft.sub = catById(fdraft.cat).subs[0].id; drawFChips(); }
    const b = e.target.closest('[data-fs2]'); if (b) { fdraft.sub = b.dataset.fs2; drawFChips(); }
  };
}

/* 토스트 */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2400); }

/* ───────────── 시작 ───────────── */
(function boot() {
  // 90일 지난 중복방지 기록 정리
  const cut = Date.now() - 90 * 864e5; for (const k in S.seen) if (S.seen[k] < cut) delete S.seen[k];
  const incoming = /^#(add|q)=/.test(location.hash || '');
  if (firstRun && !incoming) loadSample();
  runFixed(); save();
  render();
  handleHash();
  window.addEventListener('hashchange', handleHash);
  window.addEventListener('pageshow', e => { if (e.persisted) { runFixed(); render(); } });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
})();
</script>
